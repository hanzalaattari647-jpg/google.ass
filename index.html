<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="left">
            <p>G</p>

            <h1>Sign in</h1>
            <h2>Use your Google Account</h2>
        </div>

        <div class="right">

            <input type="text" placeholder="Email or phone">

            <a href="#" class="link">Forgot email?</a>

            <p class="text">
                Not your computer? Use Guest mode to sign in privately.
            </p>

            <a href="#" class="link">Learn more about using Guest mode</a>

            <div class="buttons">
                <a href="#" class="create">Create account</a>
                <button>Next</button>
            </div>

        </div>

    </div>

    <footer>
        <div>English (United States)</div>

        <div class="footer-links">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </footer>

</body>
</html>
